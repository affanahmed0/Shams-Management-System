<!DOCTYPE html>
<html>
<head>
    <title>Enrollments</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #343a40;
        }
        .btn {
            margin-bottom: 20px;
        }
        .search-form {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .btn-edit {
            background-color: #ffc107;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }
        .btn-edit:hover {
            background-color: #e0a800;
        }
        .btn-delete {
            background-color: #dc3545;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            color: white;
            cursor: pointer;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="btn btn-secondary" href="{% url 'dashboard' %}">Dashboard</a>
        <h1>Enrollments</h1>
        <a class="btn btn-primary" href="{% url 'enrollment_add' %}">Add Enrollment</a>
        
        <!-- Search Form -->
        <form method="get" action="{% url 'enrollment_list' %}" class="search-form">
            <div class="row">
                <div class="col-md-4">
                    <input type="text" name="name" class="form-control" placeholder="Search by student name..." value="{{ query_name }}">
                </div>
                <div class="col-md-3">
                    <input type="date" name="enrollment_date" class="form-control" placeholder="Search by enrollment date..." value="{{ query_enrollment_date }}">
                </div>
                <div class="col-md-3">
                    <input type="text" name="student_id" class="form-control" placeholder="Search by student ID..." value="{{ query_student_id }}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary btn-block">Search</button>
                </div>
            </div>
        </form>
        
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Course</th>
                    <th>Slot</th>
                    <th>Enrollment Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for enrollment in enrollments %}
                <tr>
                    <td>{{ enrollment.student.name }}</td>
                    <td>{{ enrollment.course.name }}</td>
                    <td>{{ enrollment.slot }}</td>
                    <td>{{ enrollment.enrollment_date }}</td>
                    <td>
                        <a class="btn-edit" href="{% url 'enrollment_edit' enrollment.pk %}">Edit</a>
                        <a class="btn-delete" href="{% url 'enrollment_delete' enrollment.pk %}">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
