{% extends 'base.html' %}

{% block title %}Courses{% endblock %}

{% block content %}
<div class="container">
    <h1 class="text-center mb-4">Courses</h1>
    <div class="mb-4">
        <a class="btn btn-primary" href="{% url 'course_add' %}">Add Course</a>
        <a class="btn btn-secondary" href="{% url 'dashboard' %}">Dashboard</a>
    </div>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Name</th>
                <th>Duration (Months)</th>
                <th>Fees</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for course in courses %}
            <tr>
                <td>{{ course.name }}</td>
                <td>{{ course.duration_months }}</td>
                <td>{{ course.fees }}</td>
                <td>
                    <a class="btn btn-sm btn-warning" href="{% url 'course_edit' course.pk %}">Edit</a>
                    <a class="btn btn-sm btn-danger" href="{% url 'course_delete' course.pk %}">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
